<!DOCTYPE html>
<html lang="id">
<head>
  <base href="/smart-id-global/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password - SMART FUND</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="font-jakarta antialiased min-h-screen flex items-center justify-center bg-slate-50 p-6">
  <div id="pageLoader" class="page-loader"><div class="loader-logo mx-auto"></div></div>

  <div class="w-full max-w-md">
    <a href="/" class="flex items-center gap-2.5 justify-center mb-8 group">
      <img src="/assets/img/logo.png" alt="SMART FUND Logo" class="w-10 h-10 object-contain transition-transform duration-300 group-hover:scale-110 animate-float" />
      <span class="text-xl font-extrabold gradient-text">SMART FUND</span>
    </a>

    <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100 hover-lift animate-zoom-in">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-extrabold text-slate-900">Lupa Password</h2>
          <p class="text-slate-500 text-sm mt-1">Reset password akun Anda</p>
        </div>
        <button id="darkToggle" class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center">
          <i class="fas fa-moon text-slate-600"></i>
        </button>
      </div>

      <!-- Step Indicators -->
      <div class="flex items-center justify-center mb-6">
        <div class="flex items-center gap-2">
          <div id="ind1" class="step-indicator active">1</div>
          <div class="w-8 h-1 bg-slate-200 rounded" id="line1"></div>
          <div id="ind2" class="step-indicator inactive">2</div>
          <div class="w-8 h-1 bg-slate-200 rounded" id="line2"></div>
          <div id="ind3" class="step-indicator inactive">3</div>
        </div>
      </div>

      <!-- Step 1: Input Email/HP -->
      <div id="fpStep1" class="space-y-4">
        <p class="text-sm text-slate-600 text-center mb-4">Masukkan email atau nomor HP terdaftar Anda untuk menerima kode OTP</p>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
          <input type="email" id="fpEmail" placeholder="email@example.com" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none" />
        </div>
        <div class="text-center text-slate-400 text-sm">— atau —</div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Nomor HP</label>
          <input type="tel" id="fpPhone" placeholder="08xxxxxxxxxx" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none" />
        </div>
        <button id="fpSendOtpBtn" class="w-full py-4 gradient-bg text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition relative btn-shine">
          <span class="btn-text"><i class="fas fa-paper-plane mr-2"></i> Kirim OTP</span>
        </button>
      </div>

      <!-- Step 2: Verifikasi OTP -->
      <div id="fpStep2" class="space-y-4 hidden">
        <div class="text-center mb-4">
          <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-key text-blue-600 text-2xl"></i>
          </div>
          <p class="text-sm text-slate-600">Masukkan kode OTP yang dikirim ke email/SMS Anda</p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Kode OTP</label>
          <input type="text" id="fpOtp" maxlength="6" placeholder="123456" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none text-center text-2xl tracking-widest font-bold" />
        </div>
        <div id="fpOtpHint" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-700"></div>
        <button id="fpVerifyBtn" class="w-full py-4 gradient-bg text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition btn-shine">
          <i class="fas fa-check mr-2"></i> Verifikasi OTP
        </button>
      </div>

      <!-- Step 3: Password Baru -->
      <div id="fpStep3" class="space-y-4 hidden">
        <div class="text-center mb-4">
          <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-lock text-green-600 text-2xl"></i>
          </div>
          <p class="text-sm text-slate-600">Buat password baru untuk akun Anda</p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Password Baru</label>
          <div class="relative">
            <input type="password" id="fpNewPassword" placeholder="Min 6 karakter" class="w-full px-4 py-3 pr-12 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none" />
            <button type="button" id="toggleNewPwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Konfirmasi Password</label>
          <div class="relative">
            <input type="password" id="fpConfirmPassword" placeholder="Ulangi password" class="w-full px-4 py-3 pr-12 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none" />
            <button type="button" id="toggleConfirmPwd" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button id="fpResetBtn" class="w-full py-4 gradient-bg text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition relative btn-shine">
          <span class="btn-text"><i class="fas fa-save mr-2"></i> Reset Password</span>
        </button>
      </div>

      <p class="text-center text-slate-600 text-sm mt-6">
        Ingat password?
        <a href="/login.html" class="text-blue-600 font-bold hover:underline">Masuk</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      hidePageLoader();

      const darkToggle = document.getElementById('darkToggle');
      const updateIcon = () => { darkToggle.innerHTML = DarkMode.isDark() ? '<i class="fas fa-sun text-amber-500"></i>' : '<i class="fas fa-moon text-slate-600"></i>'; };
      updateIcon();
      darkToggle.addEventListener('click', () => { DarkMode.toggle(); updateIcon(); });

      const steps = { 1: document.getElementById('fpStep1'), 2: document.getElementById('fpStep2'), 3: document.getElementById('fpStep3') };
      const inds = { 1: document.getElementById('ind1'), 2: document.getElementById('ind2'), 3: document.getElementById('ind3') };
      const lines = { 1: document.getElementById('line1'), 2: document.getElementById('line2') };
      let resetToken = null;
      let resetEmail = null;

      function goStep(s) {
        Object.values(steps).forEach((el) => el.classList.add('hidden'));
        steps[s].classList.remove('hidden');
        [1, 2, 3].forEach((i) => {
          inds[i].classList.remove('active', 'complete', 'inactive');
          inds[i].classList.add(i < s ? 'complete' : i === s ? 'active' : 'inactive');
        });
        [1, 2].forEach((i) => {
          lines[i].classList.remove('bg-blue-500', 'bg-slate-200');
          lines[i].classList.add(i < s ? 'bg-blue-500' : 'bg-slate-200');
        });
      }

      // Toggle passwords
      [['toggleNewPwd', 'fpNewPassword'], ['toggleConfirmPwd', 'fpConfirmPassword']].forEach(([btnId, inputId]) => {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        btn.addEventListener('click', () => {
          const isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
          btn.innerHTML = isPwd ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });
      });

      // Step 1: Send OTP
      const sendOtpBtn = document.getElementById('fpSendOtpBtn');
      sendOtpBtn.addEventListener('click', async () => {
        const email = document.getElementById('fpEmail').value.trim();
        const phone = document.getElementById('fpPhone').value.trim();
        if (!email && !phone) return showToast('Email atau nomor HP wajib diisi', 'error');

        setBtnLoading(sendOtpBtn, true);
        const res = await api('/auth/forgot-password', { method: 'POST', body: { email, phone } });
        setBtnLoading(sendOtpBtn, false);

        if (res.success) {
          resetEmail = res.debug?.email || email;
          const hint = document.getElementById('fpOtpHint');
          if (res.debug?.otp) {
            hint.classList.remove('hidden');
            hint.innerHTML = `<i class="fas fa-info-circle mr-1"></i> Demo: Kode OTP Anda adalah <b>${res.debug.otp}</b>`;
          }
          showToast('OTP berhasil dikirim', 'success');
          goStep(2);
        } else {
          showToast(res.message || 'Gagal mengirim OTP', 'error');
        }
      });

      // Step 2: Verify OTP
      document.getElementById('fpVerifyBtn').addEventListener('click', async () => {
        const otp = document.getElementById('fpOtp').value.trim();
        if (!otp || otp.length !== 6) return showToast('OTP harus 6 digit', 'error');

        const res = await api('/auth/verify-otp', { method: 'POST', body: { email: resetEmail, otp } });
        if (res.success) {
          resetToken = res.token;
          showToast('OTP valid!', 'success');
          goStep(3);
        } else {
          showToast(res.message || 'OTP tidak valid', 'error');
        }
      });

      // Step 3: Reset Password
      const resetBtn = document.getElementById('fpResetBtn');
      resetBtn.addEventListener('click', async () => {
        const newPwd = document.getElementById('fpNewPassword').value;
        const confirmPwd = document.getElementById('fpConfirmPassword').value;
        if (!newPwd || newPwd.length < 6) return showToast('Password minimal 6 karakter', 'error');
        if (newPwd !== confirmPwd) return showToast('Konfirmasi password tidak cocok', 'error');

        setBtnLoading(resetBtn, true);
        const res = await api('/auth/reset-password', { method: 'POST', body: { token: resetToken, newPassword: newPwd } });
        setBtnLoading(resetBtn, false);

        if (res.success) {
          await alertSuccess('Password Berhasil Diubah!', 'Silakan login dengan password baru Anda.');
          window.location.href = `${BASE_PATH}/login.html`;
        } else {
          showToast(res.message || 'Gagal reset password', 'error');
        }
      });
    });
  </script>
</body>
</html>
